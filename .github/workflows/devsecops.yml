name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with coverage (Quality Gate - min 70%)
        run: |
          python -m pytest tests/ -v \
            --cov=library --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sast-scan:
    name: SAST Scan (Bandit)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.7.10

      - name: Run Bandit (generate full report)
        run: bandit -r library main.py -f json -o bandit-report.json --exit-zero

      - name: Show Bandit summary
        if: always()
        run: |
          bandit -r library main.py --exit-zero | tee bandit-summary.txt
          {
            echo "### Bandit SAST Result"
            echo '```'
            tail -n 30 bandit-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: |
            bandit-report.json
            bandit-summary.txt

      - name: Quality Gate - fail on MEDIUM or HIGH severity findings
        run: bandit -r library main.py -ll
